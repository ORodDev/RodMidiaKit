<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RodDev · Media Kit</title>
  <meta name="description" content="Media kit do RodDev: criador de conteúdo, game dev e reviewer de tecnologia. 356,7M+ views, 1,2M+ seguidores e 400K+ downloads dos meus jogos.">
  <meta name="theme-color" content="#0e1020">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.rodgame.dev/">
  <meta property="og:title" content="RodDev · Media Kit">
  <meta property="og:description" content="356,7M+ views · 1,2M+ seguidores · Games, tech e game dev.">
  <meta property="og:image" content="https://www.rodgame.dev/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1020'/%3E%3Cpath d='M20 46V18h13a9 9 0 0 1 2 17.8L44 46h-8l-8-10h-1v10z' fill='%23ff8a3d'/%3E%3Ccircle cx='48' cy='16' r='5' fill='%233ee6c1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/img/rod-hero.webp">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="boot" id="boot" aria-hidden="true">
    <div class="boot-in">
      <div class="boot-logo"><span class="logo-a">Rod</span><span class="logo-b">Engine</span></div>
      <div class="boot-bar"><span></span></div>
      <div class="boot-txt">iniciando…</div>
    </div>
  </div>

  <div class="app booting" id="app">
    <header class="toolbar">
      <div class="tb-left">
        <a class="logo" href="#rod" id="logoLink" aria-label="RodEngine, voltar ao início"><span class="logo-a">Rod</span><span class="logo-b">Engine</span></a>
        <span class="scene-name">RodDev.scene <span class="crumb-sep">/</span> <span id="crumb">RodDev</span></span>
      </div>
      <div class="tb-center">
        <button class="btn play-btn" id="playBtn" type="button" aria-pressed="false" title="Play Mode (Esc para parar)">
          <svg class="i i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
          <svg class="i i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
          <span class="play-label">Play</span>
        </button>
      </div>
      <div class="tb-right">
        <button class="btn btn-ghost" id="pdfBtn" type="button" title="Gerar PDF do media kit">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hide-sm">Build PDF</span>
        </button>
        <button class="btn btn-primary" id="contactBtn" type="button">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z M4 7l8 6 8-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Contato</span>
        </button>
      </div>
    </header>

    <nav class="hierarchy panel" aria-label="Seções do media kit">
      <div class="panel-h">Hierarchy</div>
      <div class="tree-root">▾ RodDev.scene</div>
      <ul class="tree" id="tree"></ul>
    </nav>

    <nav class="tabs" id="tabs" aria-label="Seções do media kit"></nav>

    <main class="viewport" id="viewport">
      <div class="vp-progress" id="vpProgress" aria-hidden="true"></div>
      <div class="scene-bg" aria-hidden="true">
        <div class="bokeh" id="bokeh">
          <span style="--x:78%;--y:6%;--s:220px;--c:var(--amber)"></span>
          <span style="--x:92%;--y:30%;--s:120px;--c:var(--mint)"></span>
          <span style="--x:-4%;--y:52%;--s:200px;--c:var(--pink)"></span>
          <span style="--x:40%;--y:14%;--s:90px;--c:var(--orange)"></span>
          <span style="--x:64%;--y:72%;--s:160px;--c:var(--violet)"></span>
          <span style="--x:18%;--y:90%;--s:110px;--c:var(--amber)"></span>
        </div>
      </div>
      <div class="play-banner">
        <span class="pb-dot"></span> Play Mode · arraste e arremesse os objetos · <kbd>Esc</kbd> para parar
      </div>
      <div class="scroll" id="scroll">
        <div class="scene" id="scene"></div>
        <footer class="scene-foot">
          <span>Feito no <span class="logo-a">Rod</span><span class="logo-b">Engine</span> por RodDev</span>
          <span>build v1 · <span id="year"></span></span>
        </footer>
      </div>
    </main>

    <aside class="inspector panel" aria-label="Inspector">
      <div class="panel-h">Inspector</div>
      <div id="inspBody" class="insp-body"></div>
    </aside>

    <section class="console" id="console" aria-label="Console">
      <button class="console-h" id="consoleToggle" type="button" aria-expanded="true" aria-controls="consoleBody">
        <span class="console-title">Console</span>
        <span class="console-last" id="consoleLast"></span>
        <span class="console-caret" aria-hidden="true">▾</span>
      </button>
      <div class="console-body" id="consoleBody">
        <div class="console-log" id="log" role="log" aria-live="off"></div>
        <form class="console-form" id="cmdForm" autocomplete="off">
          <label for="cmd" class="prompt">&gt;</label>
          <input id="cmd" type="text" spellcheck="false" placeholder="digite help e aperte Enter" aria-label="Comando do console">
        </form>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">
      <h1>RodDev · Media Kit</h1>
      <p>356,7M+ views · 1,2M+ seguidores · 400K+ downloads dos meus jogos.</p>
      <p>Contato comercial: <a href="mailto:contato@rodgame.dev">contato@rodgame.dev</a></p>
    </div>
  </noscript>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/fx.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
